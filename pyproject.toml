[project]
name = "tgagent"
description = "Telegram remote control for Qoder Cloud Agents"
requires-python = ">=3.10"
# Single-sourced from tgagent.__version__, which qclient also reads for its User-Agent, so a
# bump cannot leave the package metadata and the running bot disagreeing.
dynamic = ["version"]
dependencies = [
    "python-telegram-bot[job-queue]==22.8",
    "httpx>=0.27,<0.29",
]

[project.scripts]
tgagent = "tgagent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tgagent"]

[tool.setuptools.dynamic]
version = {attr = "tgagent.__version__"}
