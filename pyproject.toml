[project]
name = "tgagent"
version = "0.1.0"
description = "Telegram remote control for Qoder Cloud Agents"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[job-queue]==22.8",
    "httpx>=0.27,<0.29",
]

[project.scripts]
tgagent = "tgagent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tgagent"]
